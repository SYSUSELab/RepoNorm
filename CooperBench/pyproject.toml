[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reponorm-cooperbench-runtime"
version = "0.1.0"
readme = "README.md"
description = "Selected CooperBench runtime used by RepoNorm"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = ["jinja2>=3", "litellm==1.80.10", "openai==3.11.0", "platformdirs>=3", "pydantic>=2", "python-dotenv>=1", "pyyaml>=6", "redis>=7", "rich>=13", "tenacity>=8", "unidiff>=0.7", "docker>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.sh", "*.md", "*.jinja", "*.j2"]
