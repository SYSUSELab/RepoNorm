<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 892 264" role="img" aria-labelledby="title description">
  <title id="title">How RepoNorm acquires and delivers repository norms</title>
  <desc id="description">A fixed repository snapshot feeds two discovery paths. Written rules are extracted from documents and configuration, and conventions are inferred from source code. Both sets of candidates and their evidence enter verification. Verification can request context from Git history. Accepted norms form a Markdown package. A coding agent uses the package and a coding task to produce a patch.</desc>
  <view id="mobile" viewBox="920 290 360 378"/>
  <defs>
    <linearGradient id="ink" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#10494b"/><stop offset="1" stop-color="#092f35"/>
    </linearGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r=".8" fill="#c3edda" opacity=".16"/>
    </pattern>
    <marker id="arrow" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 10" refX="7.5" refY="5" markerWidth="9" markerHeight="10">
      <path d="m1.5 1 6 4-6 4" fill="none" stroke="#9fc6b8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="history-arrow" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="8" markerHeight="8">
      <path d="m1.5 1 5 3-5 3" fill="none" stroke="#dbba87" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .name { fill: #fff1d9; font: 24px Georgia, 'Liberation Serif', serif; }
      .note { fill: #c5ded2; font: 14px Arial, Helvetica, sans-serif; }
      .history-name { fill: #f6d8a3; font: bold 15px Arial, Helvetica, sans-serif; }
      .history-note { fill: #dccbab; font: 13px Arial, Helvetica, sans-serif; }
      .wire, .packet { fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .wire { stroke: #8db7ab; stroke-width: 1.55; marker-end: url(#arrow); }
      .optional { stroke: #c7ad83; stroke-dasharray: .08 .10; marker-end: url(#history-arrow); }
      .packet { opacity: 0; stroke: #ffe2a4; stroke-width: 3.8; stroke-dasharray: .065 1.1; }
      .context { stroke: #eed3a1; stroke-width: 2.7; }
      .focus { opacity: 0; fill: none; stroke: #c8e9c9; stroke-width: 1.5; }
      @media (prefers-reduced-motion: no-preference) {
        .packet { animation: travel 8s linear var(--at) infinite; }
        .focus { animation: ring 8s ease-out var(--at) infinite; }
      }
      @keyframes travel {
        0% { opacity: 0; stroke-dashoffset: .075; }
        2% { opacity: 1; }
        12% { opacity: 1; stroke-dashoffset: -.91; }
        14%, 100% { opacity: 0; stroke-dashoffset: -1.04; }
      }
      @keyframes ring {
        0%, 18%, 100% { opacity: 0; }
        6%, 10% { opacity: .55; }
      }
      .fork { --at: 0s; }
      .merge { --at: 1.10s; }
      .query { --at: 2.20s; }
      .return { --at: 2.98s; }
      .export { --at: 4.05s; }
      .inputs { --at: 5.20s; }
      .output { --at: 6.40s; }
      .compact .name { font-size: 19.5px; }
      .compact .note { font-size: 12.5px; }
    </style>

    <!-- The two layouts share the same illustrated nodes. -->
    <g id="repository" stroke-linejoin="round" stroke-linecap="round">
      <path d="M-25-25h36l11 10v38h-46q-5 0-5-5v-39q0-4 4-4z" fill="#efe1c3" stroke="#1b4140" stroke-width="2"/>
      <path d="M-22-20h34l6 6v31h-39q-5 0-5 4v-36q0-5 4-5z" fill="#9acbb5" stroke="#315f55" stroke-width="1.7"/>
      <path d="M-17-19v35m-6 5h40" fill="none" stroke="#5e8a78" stroke-width="1.8"/>
      <g fill="none" stroke="#28574b" stroke-width="2.2">
        <path d="M-4-8v17m0-9h5q6 0 6-6"/>
        <g fill="#c4e4cc"><circle cx="-4" cy="-9" r="2.6"/><circle cx="-4" cy="9" r="2.6"/><circle cx="7" cy="-7" r="2.6"/></g>
      </g>
    </g>
    <g id="documents" stroke-linecap="round" stroke-linejoin="round">
      <g transform="rotate(-10 -7 0)">
        <path d="M-24-26H1l9 9v36h-34z" fill="#dfd3b9" stroke="#1c4341" stroke-width="1.8"/>
        <path d="M-17-11h13m-13 7h15" stroke="#71857a" stroke-width="1.8"/>
      </g>
      <path d="M-11-20h26l11 11v35h-37z" fill="#f5e9ce" stroke="#1c4341" stroke-width="1.8"/>
      <path d="M15-20v12h11" fill="#d7ceae" stroke="#6c8171" stroke-width="1.2"/>
      <g stroke="#517468" stroke-width="1.8"><path d="M-4-1h20M-4 7h20M-4 15h20"/><path d="M1-3v4m10 4v4m-6 4v4" stroke-width="3.3"/></g>
    </g>
    <g id="code" stroke-linecap="round" stroke-linejoin="round">
      <path d="m-21-14 40-7 4 30-39 8z" fill="#e7dabd" stroke="#214645" stroke-width="1.8"/>
      <rect x="-26" y="-14" width="53" height="40" rx="3" fill="#a0d4bd" stroke="#1a4644" stroke-width="1.8"/>
      <path d="M-25-5h50" stroke="#629381" stroke-width="1.4"/>
      <g fill="#517f71"><circle cx="-20" cy="-9.5" r="1.3"/><circle cx="-15" cy="-9.5" r="1.3"/></g>
      <path d="m-9 3-6 6 6 6m18-12 6 6-6 6M3 1l-5 16" fill="none" stroke="#20554d" stroke-width="2.6"/>
    </g>
    <g id="verification" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-25-26h38v44h-38z" fill="#f5e8ca" stroke="#1d4140" stroke-width="1.8"/>
      <path d="M-18-17h17m-17 7H5m-23 7h14m-14 11h11" fill="none" stroke="#648071" stroke-width="2"/>
      <path d="m12 10 14 15" stroke="#193f3e" stroke-width="9"/><path d="m12 10 14 15" stroke="#e9bd7c" stroke-width="5.8"/>
      <circle cx="7" cy="4" r="15.7" fill="#9ed7bd" stroke="#21534b" stroke-width="2"/>
      <circle cx="7" cy="4" r="12" fill="none" stroke="#639d85"/>
      <path d="m.5 4 4.5 4.5L14-1" fill="none" stroke="#24584b" stroke-width="2.6"/>
    </g>
    <g id="bundle" stroke-linejoin="round" stroke-linecap="round">
      <path d="M-27-12h19l5 5h29v29h-53z" fill="#77a991" stroke="#204743" stroke-width="1.8"/>
      <path d="m-17-19 26-6 9 5 5 31-32 7z" fill="#dacfb3" stroke="#47675b" stroke-width="1.3"/>
      <path d="M-12-24h24l8 8v32h-32z" fill="#f6e9cd" stroke="#31564d" stroke-width="1.5"/>
      <path d="M12-24v9h8m-26 5H9m-15 6H6" fill="none" stroke="#718578" stroke-width="1.6"/>
      <path d="M-27-3h51l-3 27h-45z" fill="#a3d4ba" stroke="#214a43" stroke-width="1.8"/>
      <path d="M-11 15V6l4 4 4-4v9m8-10v9m-3-3 3 3 3-3" fill="none" stroke="#326751" stroke-width="1.8"/>
    </g>
    <g id="terminal" stroke-linejoin="round" stroke-linecap="round">
      <path d="m-25-19 40-5 5 34-40 5z" fill="#efdfbf" stroke="#1b4141" stroke-width="1.7"/>
      <rect x="-22" y="-15" width="49" height="38" rx="3" fill="#153c40" stroke="#a3d8bf" stroke-width="1.9"/>
      <path d="M-21-7h47" stroke="#729b88" stroke-width="1.3"/>
      <g fill="#a6d4ba"><circle cx="-16.5" cy="-11" r="1.2"/><circle cx="-12" cy="-11" r="1.2"/></g>
      <path d="m-12 0 7 6-7 6m13 0h9" fill="none" stroke="#d2eacd" stroke-width="2.4"/>
    </g>
    <g id="diff" stroke-linejoin="round" stroke-linecap="round">
      <path d="M-19-25H8l12 12v39h-39z" fill="#f3e7c9" stroke="#244944" stroke-width="1.8"/>
      <path d="M8-25v13h12" fill="#d6cdb2" stroke="#748578" stroke-width="1.2"/>
      <g fill="none" stroke-width="2.1"><path d="M-12-3h6m4.5 0H10" stroke="#a56843"/><path d="M-12 9h6m-3-3v6m7-3h12" stroke="#398463"/></g>
    </g>
    <g id="ticket" stroke-linejoin="round" stroke-linecap="round">
      <path d="M-20-13h40v7a5 5 0 0 0 0 10v8h-40V4a5 5 0 0 0 0-10z" fill="#ead6ac" stroke="#33554a" stroke-width="1.7"/>
      <path d="M-8-9V8" stroke="#a5936d" stroke-width="1.5" stroke-dasharray="2 3"/>
      <path d="M-3-4H12M-3 3h9" stroke="#7d8069" stroke-width="1.8"/>
    </g>
    <g id="git" fill="#163d3c" stroke="#e0c08e" stroke-width="2" stroke-linecap="round">
      <path d="M-6-8V9m0-7h4q8 0 8-7" fill="none"/>
      <circle cx="-6" cy="-8" r="2.9"/><circle cx="-6" cy="9" r="2.9"/><circle cx="6" cy="-6" r="2.9"/>
    </g>

    <!-- Paths run from source to target so the same geometry also carries the animated signals. -->
    <g id="wide-fork">
      <path pathLength="1" d="M100 128h13q12 0 12-12V75q0-12 12-12h43"/>
      <path pathLength="1" d="M100 128h13q12 0 12 12v37q0 12 12 12h43"/>
    </g>
    <g id="wide-merge">
      <path pathLength="1" d="M248 63h31q12 0 12 12v41q0 12 12 12h35"/>
      <path pathLength="1" d="M248 189h31q12 0 12-12v-37q0-12 12-12h35"/>
    </g>
    <path id="wide-query" pathLength="1" d="M360 96q-12-16-3-34"/>
    <path id="wide-return" pathLength="1" d="M387 62q10 18 0 34"/>
    <path id="wide-export" pathLength="1" d="M410 128h16q12 0 12-12V96q0-12 12-12h42"/>
    <g id="wide-inputs">
      <path pathLength="1" d="M562 84h31q12 0 12 12v20q0 12 12 12h38"/>
      <path pathLength="1" d="M556 196h37q12 0 12-12v-44q0-12 12-12h38"/>
    </g>
    <path id="wide-output" pathLength="1" d="M726 128h73"/>

    <g id="small-fork">
      <path pathLength="1" d="M180 46v2q0 7-7 7H96q-8 0-8 8v4"/>
      <path pathLength="1" d="M180 46v2q0 7 7 7h75q8 0 8 8v4"/>
    </g>
    <g id="small-merge">
      <path pathLength="1" d="M88 141v6q0 7-7 7h-6q-8 0-8 8v7"/>
      <path pathLength="1" d="M270 141v6q0 7-7 7H75q-8 0-8 8v7"/>
    </g>
    <path id="small-query" pathLength="1" d="M155 179q41-16 83 0"/>
    <path id="small-return" pathLength="1" d="M238 187q-41 11-83 0"/>
    <path id="small-export" pathLength="1" d="M67 214v24"/>
    <g id="small-inputs">
      <path pathLength="1" d="M67 284v8q0 8 8 8h9q8 0 8 8v7"/>
      <path pathLength="1" d="M246 277v15q0 8-8 8H100q-8 0-8 8v7"/>
    </g>
    <path id="small-output" pathLength="1" d="M121 337h122"/>
  </defs>

  <rect width="892" height="264" rx="16" fill="url(#ink)"/>
  <rect width="892" height="264" rx="16" fill="url(#dots)"/>
  <g class="wire">
    <use href="#wide-fork"/><use href="#wide-merge"/>
    <use href="#wide-query" class="optional"/><use href="#wide-return" class="optional"/>
    <use href="#wide-export"/><use href="#wide-inputs"/><use href="#wide-output"/>
  </g>
  <g>
    <use href="#wide-fork" class="packet fork"/><use href="#wide-merge" class="packet merge"/>
    <use href="#wide-query" class="packet context query"/><use href="#wide-return" class="packet context return"/>
    <use href="#wide-export" class="packet export"/><use href="#wide-inputs" class="packet inputs"/><use href="#wide-output" class="packet output"/>
  </g>
  <g text-anchor="middle">
    <g transform="translate(65 128)">
      <use href="#repository"/><text class="name" y="47">Repository</text><text class="note" y="68">Fixed snapshot</text>
    </g>
    <g transform="translate(214 63)">
      <use href="#documents"/><text class="name" y="46">Extract rules</text><text class="note" y="66">Docs &amp; configs</text>
    </g>
    <g transform="translate(214 189)">
      <use href="#code"/><text class="name" y="46">Infer norms</text><text class="note" y="66">Patterns in code</text>
    </g>
    <g transform="translate(374 128)">
      <circle class="focus return" cx="7" cy="4" r="20"/>
      <use href="#verification"/><text class="name" y="47">Verify</text><text class="note" y="68">Scope &amp; exceptions</text>
    </g>
    <g transform="translate(374 34)">
      <use href="#git" x="-39"/><text class="history-name" x="13" y="4">Git history</text><text class="history-note" x="9" y="21">if needed</text>
    </g>
    <g transform="translate(527 84)">
      <use href="#bundle"/><text class="name" y="47">Norm package</text><text class="note" y="68">Static Markdown</text>
    </g>
    <g transform="translate(527 196)">
      <use href="#ticket"/><text class="name" y="39">Coding task</text>
    </g>
    <g transform="translate(690 128)">
      <use href="#terminal"/><text class="name" y="47">Coding agent</text>
    </g>
    <g transform="translate(833 128)">
      <use href="#diff"/><text class="name" y="47">Patch</text>
    </g>
  </g>

  <!-- Portrait layout for narrow README columns, with the same branches and directions. -->
  <g transform="translate(920 290)" class="compact">
    <rect width="360" height="378" rx="13" fill="url(#ink)"/>
    <rect width="360" height="378" rx="13" fill="url(#dots)"/>
    <g class="wire">
      <use href="#small-fork"/><use href="#small-merge"/>
      <use href="#small-query" class="optional"/><use href="#small-return" class="optional"/>
      <use href="#small-export"/><use href="#small-inputs"/><use href="#small-output"/>
    </g>
    <g>
      <use href="#small-fork" class="packet fork"/><use href="#small-merge" class="packet merge"/>
      <use href="#small-query" class="packet context query"/><use href="#small-return" class="packet context return"/>
      <use href="#small-export" class="packet export"/><use href="#small-inputs" class="packet inputs"/><use href="#small-output" class="packet output"/>
    </g>
    <use href="#repository" transform="translate(105 25) scale(.66)"/>
    <text x="132" y="32" class="name">Repository snapshot</text>
    <g text-anchor="middle">
      <use href="#documents" transform="translate(88 90) scale(.69)"/>
      <text x="88" y="124" class="name">Extract rules</text><text x="88" y="138" class="note">Docs &amp; configs</text>
      <use href="#code" transform="translate(270 90) scale(.69)"/>
      <text x="270" y="124" class="name">Infer norms</text><text x="270" y="138" class="note">Patterns in code</text>
    </g>
    <use href="#verification" transform="translate(67 191) scale(.72)"/>
    <text x="93" y="190" class="name">Verify</text><text x="93" y="207" class="note">Scope &amp; exceptions</text>
    <use href="#git" transform="translate(254 189) scale(.83)"/>
    <text x="269" y="186" class="history-name">Git history</text><text x="269" y="204" class="history-note">if needed</text>
    <use href="#bundle" transform="translate(67 261) scale(.72)"/>
    <text x="93" y="260" class="name">Norm package</text><text x="93" y="278" class="note">Static Markdown</text>
    <use href="#ticket" transform="translate(246 261) scale(.64)"/>
    <text x="265" y="267" class="name">Task</text>
    <g text-anchor="middle">
      <use href="#terminal" transform="translate(92 337) scale(.72)"/>
      <text x="92" y="369" class="name">Coding agent</text>
      <use href="#diff" transform="translate(270 337) scale(.72)"/>
      <text x="270" y="369" class="name">Patch</text>
    </g>
  </g>
</svg>
