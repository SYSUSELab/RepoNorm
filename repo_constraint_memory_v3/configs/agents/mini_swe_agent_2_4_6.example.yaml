schema_version: agent-profile-1.1
profile_id: mini-swe-agent-2.4.6-runtime
adapter: subprocess_runner
runner_protocol_version: norm4code-agent-runner-1.2
adapter_id: norm4code-mini-swe-agent-cli
adapter_version: "1.4"
framework_id: mini-swe-agent
framework_version: 2.4.6

runner_command:
  - python
  - -m
  - repo_constraint_memory_v3.integrations.agent_runners.mini_swe_agent
runner_options:
  mini_executable: mini
  bubblewrap_executable: bwrap
  command_timeout_seconds: 30
  max_consecutive_format_errors: 3
  # Cost lookup is integration metadata, not the execution-model identity.
  cost_tracking: ignore_errors

sandbox_profile_id: mini-swe-agent-bubblewrap-no-network-v1
sandbox:
  filesystem_scope: filtered_workspace
  target_repository_access: absent
  network_access: denied
  environment_access: allowlist
