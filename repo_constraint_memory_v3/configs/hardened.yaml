repository:
  name: null

discovery:
  target_content_admission_policy: controlled-research-unredacted-target-content-1.0
  include_linked_docs_one_hop: true
  max_manifest_files: 25000
  max_manifest_file_bytes: 2000000
  max_manifest_total_bytes: 50000000
  max_source_files: 300
  max_source_file_bytes: 1000000
  max_total_source_bytes: 10000000
  max_supplement_proposals: 64
  exclude: []

agent:
  required: true
  stages:
    source_discovery:
      enabled: true
      required: true
      timeout_seconds: 900
      max_turns: 30
      max_workspace_files: 10000
      max_workspace_bytes: 50000000
      max_output_bytes: 200000
      max_trajectory_bytes: 20000000
      max_input_tokens: 10000000
      max_output_tokens: 1000000
      cost_limit_usd: 5.0

chunking:
  max_unit_chars: 4000
  max_units: 5000
  max_batch_chars: 8000
  max_units_per_batch: 1
  max_batches: 1000

llm:
  # Match the frozen full-run profile. Reducer merge responses can legitimately
  # contain up to 64 drafts from a 128-draft merge input; the former 16k value
  # truncated valid merge responses before the schema/resource caps applied.
  max_output_tokens: 64000
  timeout_seconds: 600
  max_provider_response_bytes: 32000000
  # Two error-aware repairs are available to extraction and reduction. Unified
  # semantic stages retain their stricter stage-local cap.
  schema_repairs: 2
  output_limit_retries: 1
  max_concurrency: 24
  # One transient-provider retry bounds wave reservations at 12 attempts per
  # logical request while retaining two schema repairs and one length retry.
  provider_retries: 1
  provider_retry_delay_seconds: 5
  provider_retry_backoff_multiplier: 2
  provider_retry_max_delay_seconds: 30
  provider_retry_jitter_seconds: 2
  max_total_calls: 15000
  max_total_input_tokens: 100000000
  max_total_output_tokens: 20000000
  max_inference_artifact_bytes: 20000000

observation:
  enabled: true
  queries:
    - name: python_snapshot
      required: true
    - name: python_clone_clusters
      required: true
  max_python_files: 5000
  max_python_file_bytes: 1000000
  max_total_python_bytes: 20000000
  max_ast_nodes_per_file: 200000
  max_entities_per_file: 10000
  max_relations_per_file: 50000
  max_total_entities: 500000
  max_total_relations: 2000000
  max_parse_failures: 100
  max_symbol_chars: 512
  max_file_artifact_bytes: 5000000
  max_total_observation_bytes: 100000000
  max_cache_entry_bytes: 5000000
  max_workers: 4

semantic:
  enabled: true
  required: true
  max_units: 1000
  max_unit_source_bytes: 200000
  max_packet_bytes: 300000
  max_total_packet_bytes: 500000000
  max_context_refs_per_packet: 1000
  max_map_packets_per_request: 32
  max_map_request_bytes: 2000000
  max_observations_per_primary_unit: 64
  max_total_observations: 500
  # Raw partitions and merge payloads have separate limits: two full 64-item
  # child shards must fit together so every merge wave can make progress.
  max_reduce_items_per_request: 16
  max_reduce_request_bytes: 200000
  max_hypotheses_per_component: 64
  max_total_hypotheses: 10000
  max_population_query_nodes: 256
  max_population_query_depth: 16
  max_population_literal_values: 2000
  max_population_members: 1000000
  max_population_members_per_hypothesis: 100000
  max_total_population_members: 2000000
  # Reducers aim below the soft target. Wider complete semantic populations
  # retain their exact census and use deterministic inspected-member sampling.
  target_population_members_per_hypothesis: 15
  max_classified_population_members_per_hypothesis: 20
  max_total_classified_population_members: 1000
  max_population_artifact_bytes: 50000000
  max_classification_members_per_request: 16
  max_classification_request_bytes: 2000000
  max_classification_calls_per_hypothesis: 32
  max_classification_request_bytes_per_hypothesis: 16000000
  max_total_classification_calls: 256
  max_total_classification_request_bytes: 64000000
  max_member_packet_bytes: 250000
  max_falsification_items_per_request: 16
  max_falsification_request_bytes: 2000000
  max_falsification_calls_per_hypothesis: 16
  max_falsification_request_bytes_per_hypothesis: 8000000
  max_total_falsification_calls: 128
  max_total_falsification_request_bytes: 32000000
  max_refinement_rounds: 1
  max_current_source_artifact_bytes: 500000000


unified:
  enabled: true
  required: true
  candidate_grouping_mode: singleton
  max_candidate_members: 20000
  max_cases: 20000
  max_block_members: 32
  max_group_pairs: 100000
  max_group_pairs_per_request: 64
  max_group_members_per_request: 32
  max_group_request_bytes: 1000000
  max_blocking_anchors_per_member: 32
  max_blocking_paths_per_member: 32
  max_blocking_tokens_per_member: 64
  max_blocking_anchor_bytes: 512
  lexical_min_shared_tokens: 2
  max_case_members: 32
  max_case_input_bytes: 2000000
  max_current_evidence_items: 100000
  max_current_evidence_bytes: 10000000
  max_observation_context_items_per_case: 64
  git_enabled: true
  git_command_timeout_seconds: 30
  git_object_scan_timeout_seconds: 120
  git_max_commands_per_case: 16
  git_max_queries_per_family: 4
  git_max_results_per_query: 24
  git_max_patches_per_case: 32
  git_max_bytes_per_command: 2000000
  git_max_object_scan_bytes: 64000000
  git_max_bytes_per_case: 8000000
  git_max_commit_message_bytes: 4096
  git_min_path_history: 1
  git_min_blame: 1
  git_min_pickaxe_literal: 1
  git_min_pickaxe_regex: 1
  git_rename_similarity_percent: 50
  git_patch_context_lines: 3
  git_max_changed_paths_per_commit: 128
  max_temporal_items_per_case: 64
  max_temporal_batch_items: 16
  max_temporal_cells_per_request: 128
  max_temporal_request_bytes: 2000000
  max_refinement_rounds: 1
  max_refinement_children: 2
  max_unified_artifact_bytes: 500000000

output:
  save_diagnostics: false
