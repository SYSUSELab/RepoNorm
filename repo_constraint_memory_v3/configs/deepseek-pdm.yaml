# deepseek-v4-flash configuration for Norm4Code PDM experiment
# API via apiyi platform
repository:
  name: null

discovery:
  include_linked_docs_one_hop: true
  max_manifest_files: 25000
  max_manifest_file_bytes: 2000000
  max_manifest_total_bytes: 50000000
  max_source_files: 300
  max_source_file_bytes: 1000000
  max_total_source_bytes: 10000000
  max_supplement_proposals: 64
  exclude: []

agent:
  required: true
  stages:
    source_discovery:
      enabled: true
      required: true
      timeout_seconds: 900
      max_turns: 30
      max_workspace_files: 10000
      max_workspace_bytes: 50000000
      max_output_bytes: 200000
      max_trajectory_bytes: 20000000
      max_input_tokens: 10000000
      max_output_tokens: 1000000
      cost_limit_usd: 5.0

chunking:
  max_unit_chars: 4000
  max_units: 5000
  max_batch_chars: 8000
  max_units_per_batch: 1
  max_batches: 1000

llm:
  provider: openai_compatible
  model: deepseek-v4-flash
  api_key_env: OPENAI_API_KEY
  base_url: https://api.apiyi.com/v1
  temperature: 0
  thinking_mode: disabled
  max_output_tokens: 32000
  timeout_seconds: 1200
  schema_repairs: 3
  output_limit_retries: 2
  max_concurrency: 4
  provider_retries: 4
  provider_retry_delay_seconds: 1
  provider_retry_backoff_multiplier: 2
  provider_retry_max_delay_seconds: 30
  provider_retry_jitter_seconds: 0.5
  max_total_calls: 10000
  max_total_input_tokens: 100000000
  max_total_output_tokens: 20000000
  max_inference_artifact_bytes: 20000000

observation:
  enabled: true
  queries:
    - name: python_snapshot
      required: true
    - name: python_clone_clusters
      required: true
  max_python_files: 5000
  max_python_file_bytes: 1000000
  max_total_python_bytes: 20000000
  max_ast_nodes_per_file: 200000
  max_entities_per_file: 10000
  max_relations_per_file: 50000
  max_total_entities: 500000
  max_total_relations: 2000000
  max_parse_failures: 100
  max_symbol_chars: 512
  max_file_artifact_bytes: 5000000
  max_total_observation_bytes: 100000000
  max_cache_entry_bytes: 5000000
  max_workers: 4

semantic:
  enabled: true
  required: true
  max_units: 500000
  max_unit_source_bytes: 200000
  max_packet_bytes: 300000
  max_total_packet_bytes: 500000000
  max_context_refs_per_packet: 1000
  max_map_packets_per_request: 32
  max_map_request_bytes: 2000000
  max_observations_per_primary_unit: 64
  max_total_observations: 500000
  max_reduce_items_per_request: 64
  max_reduce_request_bytes: 2000000
  max_hypotheses_per_component: 16
  max_total_hypotheses: 10000
  max_population_query_nodes: 256
  max_population_query_depth: 16
  max_population_literal_values: 2000
  max_population_members: 1000000
  max_population_members_per_hypothesis: 100000
  max_total_population_members: 2000000
  max_population_artifact_bytes: 50000000
  max_classification_members_per_request: 16
  max_classification_request_bytes: 2000000
  max_member_packet_bytes: 250000
  max_falsification_items_per_request: 16
  max_falsification_request_bytes: 2000000
  max_refinement_rounds: 1
  max_current_source_artifact_bytes: 2000000000

history:
  enabled: false
  max_walk_commits: 300
  max_python_commits: 80
  max_changed_files_per_commit: 200
  max_change_units: 2000
  max_diff_bytes_per_unit: 200000
  max_context_files_per_unit: 8
  max_context_bytes_per_unit: 200000
  max_map_units_per_request: 8
  max_equivalence_items_per_request: 16
  max_equivalence_repository_items: 256
  episode_proximity_hours: 72
  max_episode_relations: 100000
  max_current_population_members: 100000
  exhaustive_current_member_limit: 64
  sampled_current_member_limit: 64
  max_current_members_per_request: 16
  max_total_calls: 2000
  max_total_input_tokens: 20000000
  max_total_output_tokens: 5000000
  max_artifact_bytes: 500000000

output:
  save_diagnostics: false
