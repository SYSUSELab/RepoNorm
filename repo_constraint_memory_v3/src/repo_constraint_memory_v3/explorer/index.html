<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Knowledge explorer · RepoNorm</title>
  <link rel="stylesheet" href="/explorer.css">
  <script src="/explorer.js" defer></script>
</head>
<body>
  <header class="top"><div class="wrap top-inner">
    <span class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>RepoNorm</span>
    <span class="product">Knowledge explorer</span>
    <span class="local"><i></i>Local session</span>
  </div></header>
  <main class="wrap">
    <p id="loading" role="status">Opening knowledge package…</p>
    <div id="app" hidden>
      <div class="mast">
        <div><h1>Knowledge explorer</h1>
          <div class="meta"><strong id="package-name"></strong><span class="divider">/</span><span id="view"></span><span id="coverage"></span></div>
        </div>
        <button id="info" class="secondary">Package details <span aria-hidden="true">↗</span></button>
      </div>
      <section class="summary" aria-label="Package overview">
        <div class="metric"><h2>Claims in view</h2><strong id="total"></strong></div>
        <div class="metric"><button id="browse-scopes" class="scope-metric" aria-label="Browse claims by scope">
          <span>Scope patterns <span aria-hidden="true">↗</span></span><strong id="scope-count"></strong>
        </button></div>
      </section>
      <section class="catalog" aria-labelledby="catalog-title">
        <div class="section-head"><h2 id="catalog-title">Claim catalog</h2><span id="matching" role="status"></span></div>
        <div class="toolbar">
          <label class="search"><span class="magnify" aria-hidden="true"></span>
            <input id="search" type="search" placeholder="Search rules, paths, or claim IDs" aria-label="Search rules, paths, or claim IDs"></label>
          <select id="strength" aria-label="Filter by normative strength"><option value="">All strengths</option></select>
          <select id="status" aria-label="Filter by claim status"><option value="">All statuses</option></select>
        </div>
        <button id="clear-scope" class="secondary" hidden></button>
        <div class="table-wrap"><table><thead><tr><th>Rule</th><th>Scope</th><th>Strength</th><th>Status</th><th aria-label="Details"></th></tr></thead><tbody id="rows"></tbody></table>
          <div id="empty" hidden><h3 id="empty-title"></h3><button id="reset" class="secondary">Clear filters</button></div>
          <div class="pager"><span id="range"></span><div><button id="prev" aria-label="Previous page">←</button><button id="next" aria-label="Next page">→</button></div></div>
        </div>
      </section>
    </div>
  </main>
  <dialog id="dialog" aria-labelledby="dialog-title">
    <header><h2 id="dialog-title"></h2><button id="close" aria-label="Close details" autofocus>×</button></header>
    <div class="dialog-body" id="details"></div>
  </dialog>
</body>
</html>
