[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-constraint-memory-v3"
version = "0.18.0"
description = "Snapshot-bound Python repository norm acquisition with unified current and temporal evidence."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.8",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
agent-mini-swe = ["mini-swe-agent==2.4.6"]

[project.scripts]
repo-memory-v3 = "repo_constraint_memory_v3.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"repo_constraint_memory_v3.model_profile_data" = ["*.yaml"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]
